<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5f4a">
<title>Mietsuche</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<style>
  :root {
    --bg: #f4f1ec; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e0d8;
    --accent: #1f5f4a; --accent-text: #ffffff; --soft: #e8f0ec;
    --ok: #1f7a4d; --warn: #a15c00; --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141513; --card: #1e201d; --text: #ecebe6; --muted: #9b9a93; --line: #2f322d;
      --accent: #5fb38f; --accent-text: #0e1a14; --soft: #22322a;
      --ok: #6fcf97; --warn: #f2b45a; --bad: #f08a80;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg);
    padding: max(12px, env(safe-area-inset-top)) 16px 8px; border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 12px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  button, .btn { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    background: var(--soft); color: var(--text); text-decoration: none; display: inline-flex;
    align-items: center; justify-content: center; gap: 6px; }
  .primary { background: var(--accent); color: var(--accent-text); }
  .tabs { display: flex; gap: 8px; overflow-x: auto; max-width: 720px; margin: 10px auto 0;
    scrollbar-width: none; }
  .tabs button { white-space: nowrap; padding: 6px 12px; border-radius: 999px; font-size: 14px; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px 40px; }
  .item { position: relative; }
  .item .del { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; padding: 0;
    border-radius: 999px; font-size: 16px; line-height: 1; }
  .item .card h2 { padding-right: 40px; }
  .card { display: flex; gap: 12px; background: var(--card); border-radius: 14px; padding: 10px;
    margin-bottom: 10px; color: inherit; text-decoration: none; border: 1px solid var(--line); }
  .thumb { width: 96px; height: 96px; flex: none; border-radius: 10px; object-fit: cover;
    background: var(--soft); }
  .card h2 { font-size: 15px; margin: 0 0 2px; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .meta { color: var(--muted); font-size: 13px; }
  .facts { font-weight: 600; font-size: 14px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--soft); }
  .s-neu { background: var(--accent); color: var(--accent-text); }
  .ok { color: var(--ok); } .unklar { color: var(--warn); } .nein { color: var(--bad); }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .hero { width: 100%; max-height: 300px; object-fit: cover; border-radius: 14px; background: var(--soft); }
  .gallery { position: relative; }
  .gallery .strip { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 6px;
    border-radius: 14px; scrollbar-width: none; }
  .gallery .strip::-webkit-scrollbar { display: none; }
  .gallery a { flex: none; width: 100%; scroll-snap-align: center; }
  .gallery img { width: 100%; height: 300px; object-fit: cover; border-radius: 14px; background: var(--soft);
    display: block; }
  .gallery .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px;
    padding: 0; border: 0; border-radius: 999px; background: #000a; color: #fff; font-size: 26px; line-height: 1; }
  .gallery .prev { left: 8px; } .gallery .next { right: 8px; }
  .gallery .count { position: absolute; right: 10px; bottom: 10px; background: #000a; color: #fff;
    font-size: 12px; padding: 2px 8px; border-radius: 999px; }
  .fake { border-color: var(--warn); }
  .fake ul { margin: 4px 0 8px; padding-left: 18px; }
  .detail h2 { margin: 12px 0 4px; font-size: 20px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    margin-top: 12px; }
  .panel h3 { margin: 0 0 8px; font-size: 15px; }
  .checks { list-style: none; padding: 0; margin: 0; }
  .checks li { padding: 4px 0; }
  .steps { display: grid; gap: 8px; }
  .steps .btn, .steps button { width: 100%; padding: 12px; }
  textarea { width: 100%; font: inherit; font-size: 15px; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px; background: var(--bg); color: var(--text); resize: vertical; }
  .statuses { display: flex; flex-wrap: wrap; gap: 6px; }
  .statuses button { padding: 6px 12px; font-size: 14px; border-radius: 999px; }
  .statuses button.on { background: var(--accent); color: var(--accent-text); }
  .back { background: none; padding: 6px 0; color: var(--accent); }
  details summary { cursor: pointer; color: var(--muted); }
  .trip ul { margin: 4px 0 0; padding-left: 18px; }
  .trip li { padding: 3px 0; }
  .desc { white-space: pre-wrap; font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text);
    color: var(--bg); padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s;
    pointer-events: none; }
  .toast.show { opacity: 1; }
  #map { height: 260px; border-radius: 10px; margin-bottom: 8px; }
</style>
<link rel="stylesheet" href="/leaflet/leaflet.css">
<script src="/leaflet/leaflet.js" defer></script>
</head>
<body>
<header>
  <div class="bar">
    <h1>Mietsuche</h1>
    <button id="push" hidden>🔔 Push aktivieren</button>
    <a class="btn" href="#/vorlage" title="Anschreiben-Vorlage">✎ Vorlage</a>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const LABELS = {
  neu: "Neu", angefragt: "Angefragt", antwort: "Antwort", besichtigung: "Besichtigung",
  zusage: "Zusage", abgesagt: "Abgesagt", uninteressant: "Gelöscht",
};
const CHECK_LABELS = {
  objektart: "Objekt", ort: "Ort", zimmer: "Zimmer", miete: "Miete",
  haustiere: "Haustiere", aussenbereich: "Garten/Balkon",
};
const ICON = { ja: "✅", unklar: "❓", nein: "❌" };
const CLOSED = ["abgesagt", "uninteressant"];
// Gelöschte Anzeigen zählen nicht mehr als aktiv, bleiben aber unter ihrem Status sichtbar.
// „Aktiv“ sind nur Treffer, um die sich noch niemand gekümmert hat; angefragte usw. haben eigene Reiter.
const isActive = (l) => l.status === "neu" && !l.offline;

let state = { listings: [], statuses: [], filter: "aktiv" };

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    // ngrok zeigt sonst bei kostenlosen Konten eine Warnseite statt der Antwort.
    headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "1" }, credentials: "same-origin", ...options,
  });
  if (res.status === 401) { location.href = "/login"; throw new Error("login"); }
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.json();
}

const euroQm = (n) => n.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €/m²";

const pct = (n) => `${n > 0 ? "+" : ""}${n} %`;

function rentShort(l) {
  const r = l.rent_index;
  if (!r || !r.qm) return "";
  if (r.art === "angebote") return `📊 Ortsdurchschnitt: ${pct(r.abweichung)}`;
  if (r.abweichung !== undefined) {
    const sign = r.abweichung > 0 ? "+" : "";
    return `📊 Mietenspiegel: ${sign}${r.abweichung} % zum Mittel`;
  }
  return r.bewertung === "im Rahmen" ? "📊 Mietenspiegel: im üblichen Rahmen"
    : `📊 Mietenspiegel: ${r.bewertung} dem üblichen Rahmen`;
}

function rentPanel(l) {
  const r = l.rent_index;
  if (!r || (!r.qm && !r.hinweis)) return "";
  let body;
  if (!r.qm) {
    body = `<p>${esc(r.hinweis)}</p>`;
  } else if (r.art === "angebote") {
    body = `<ul class="checks">
      <li><b>Diese Wohnung:</b> ${euroQm(r.qm)} kalt</li>
      <li><b>Durchschnitt der Anzeigen:</b> ${euroQm(r.median)} (${esc(r.gruppe)})</li>
      <li><b>Abweichung:</b> ${pct(r.abweichung)}</li>
    </ul>
    <div class="meta">${esc(r.hinweis)} Quelle: Wohnungsmarktprofil 2025 der Investitionsbank
      Schleswig-Holstein. Nur eine Orientierung.</div>`;
  } else {
    const known = [r.lage ? `${r.lage === "gut" ? "gute" : "normale"} Wohnlage` : "Wohnlage unbekannt",
                   r.baujahr ? `Baujahr ${r.baujahr}` : "Baujahr unbekannt"].join(", ");
    const mittel = r.mittel_von === r.mittel_bis ? euroQm(r.mittel_von)
      : `${euroQm(r.mittel_von)} bis ${euroQm(r.mittel_bis)}`;
    const diff = r.abweichung !== undefined
      ? `<li><b>Abweichung:</b> ${r.abweichung > 0 ? "+" : ""}${r.abweichung} % zum Mittelwert</li>` : "";
    body = `<ul class="checks">
      <li><b>Diese Wohnung:</b> ${euroQm(r.qm)} kalt</li>
      <li><b>Mietenspiegel-Mittel:</b> ${mittel}</li>
      <li><b>Üblicher Rahmen:</b> ${euroQm(r.spanne_von)} bis ${euroQm(r.spanne_bis)}</li>${diff}
      <li><b>Ergebnis:</b> ${r.bewertung === "im Rahmen" ? "im üblichen Rahmen" : esc(r.bewertung) + " dem üblichen Rahmen"}</li>
    </ul>
    <div class="meta">Gerechnet mit: ${esc(known)}. Hamburger Mietenspiegel 2025, Kaltmiete ohne Nebenkosten.
      Nur eine Orientierung, keine rechtliche Prüfung. Bei deutlich höherer Miete kann der Mieterverein helfen.</div>`;
  }
  return `<div class="panel"><h3>${r.art === "angebote" ? "Preis im Ortsvergleich" : "Mietenspiegel"}</h3>${body}</div>`;
}

function places(l) {
  // Wohnung und Arbeitsorte (je Person einmal) aus den Fahrzeiten
  const seen = new Map();
  for (const c of l.commute || []) if (c.nach && !seen.has(c.name)) seen.set(c.name, c);
  const home = (l.commute || []).find((c) => c.von);
  return home ? { home: home.von, work: [...seen.values()], approx: home.ungefaehr } : null;
}

function gallery(l) {
  if (!l.bilder || l.bilder.length < 2) return img(l.image_url, "hero");
  return `<div class="gallery"><div class="strip" id="strip">${l.bilder.map((u) =>
    `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy"></a>`).join("")}</div>
    <button class="nav prev" id="prev" aria-label="Voriges Bild">‹</button>
    <button class="nav next" id="next" aria-label="Nächstes Bild">›</button>
    <span class="count" id="count">1 / ${l.bilder.length}</span></div>`;
}

function watchGallery() {
  const strip = $("#strip");
  if (!strip) return;
  const total = strip.children.length;
  const current = () => Math.round(strip.scrollLeft / strip.children[0].offsetWidth);
  const show = (i) => {
    i = (i + total) % total;  // nach dem letzten Bild wieder zum ersten
    strip.scrollTo({ left: strip.children[i].offsetLeft - strip.offsetLeft, behavior: "smooth" });
  };
  strip.onscroll = () => { $("#count").textContent = `${Math.min(current() + 1, total)} / ${total}`; };
  $("#prev").onclick = () => show(current() - 1);
  $("#next").onclick = () => show(current() + 1);
}

function fakePanel(l) {
  if (!l.auffaellig || !l.auffaellig.length) return "";
  return `<div class="panel fake"><h3>⚠️ Auffällig, bitte vorsichtig sein</h3>
    <ul>${l.auffaellig.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>
    <div class="meta">Das sind Warnzeichen, kein Beweis. Nie Geld überweisen oder den Ausweis schicken,
      bevor ihr die Wohnung von innen gesehen und den Vermieter getroffen habt.</div></div>`;
}

function mapPanel(l) {
  const p = places(l);
  if (!p) return "";
  const km = p.work.map((c) => `<li><b>${esc(c.name)}:</b> ${c.km.toLocaleString("de-DE")} km Luftlinie</li>`).join("");
  const approx = p.approx ? '<div class="meta">Punkt ungefähr: Die Anzeige nennt keine Straße.</div>' : "";
  return `<div class="panel"><h3>Lage</h3><div id="map"></div><ul class="checks">${km}</ul>${approx}</div>`;
}

function drawMap(l) {
  const p = places(l);
  if (!p || !window.L || !$("#map")) return;
  const map = L.map("map", { scrollWheelZoom: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  const home = L.circleMarker(p.home, { radius: 9, color: "#c0392b", fillOpacity: 0.9 })
    .bindTooltip("Wohnung", { permanent: true, direction: "top" }).addTo(map);
  const points = [p.home];
  for (const c of p.work) {
    L.circleMarker(c.nach, { radius: 7, color: "#2c3e8f", fillOpacity: 0.9 })
      .bindTooltip(`${c.name}: ${c.km.toLocaleString("de-DE")} km`, { permanent: true, direction: "top" }).addTo(map);
    L.polyline([p.home, c.nach], { color: "#2c3e8f", weight: 2, dashArray: "4 6" }).addTo(map);
    points.push(c.nach);
  }
  map.fitBounds(points, { padding: [30, 30] });
  home.bringToFront();
}

function marketShort(l) {
  const m = l.market;
  if (!m || !m.median) return "";
  return `📈 Andere Anzeigen: ${pct(m.abweichung)}`;
}

function marketPanel(l) {
  const m = l.market;
  if (!m || (!m.median && !m.zu_wenige)) return "";
  const body = m.median ? `<ul class="checks">
      <li><b>Diese Wohnung:</b> ${euroQm(m.qm)} kalt</li>
      <li><b>Mittlerer Preis ähnlicher Anzeigen:</b> ${euroQm(m.median)}</li>
      <li><b>Abweichung:</b> ${pct(m.abweichung)}</li>
    </ul>
    <div class="meta">Verglichen mit ${m.anzahl} Anzeigen (${esc(m.gruppe)}) der letzten 6 Monate, die die Mietsuche
      selbst gesammelt hat. ${m.wenige ? "Noch wenige Vergleichsanzeigen, der Wert wird mit der Zeit genauer." : ""}</div>`
    : `<p>Noch zu wenige Vergleichsanzeigen (${m.anzahl}). Der Vergleich erscheint, sobald mehr gesammelt sind.</p>`;
  return `<div class="panel"><h3>Vergleich mit anderen Anzeigen</h3>${body}</div>`;
}

function commuteShort(l) {
  if (!l.commute || !l.commute.length) return "";
  const byName = new Map();
  for (const c of l.commute) {
    if (!byName.has(c.name)) byName.set(c.name, []);
    byName.get(c.name).push((c.tage && c.tage !== "Mo–Fr" ? c.tage + " " : "") + `${c.minuten} Min.`);
  }
  return "🚆 " + [...byName].map(([name, times]) => `${name} ${times.join(", ")}`).join(" · ");
}

function tripSteps(c) {
  if (!c.schritte || !c.schritte.length) return "";
  const rows = c.schritte.map((s) => {
    if (s.linie === "zu Fuß") {
      const dist = s.meter ? `, ${s.meter} m` : "";
      return `<li>${esc(s.ab)}–${esc(s.an)} 🚶 zu Fuß ${s.minuten} Min.${dist}: ${esc(s.von)} → ${esc(s.nach)}</li>`;
    }
    const dir = s.richtung ? ` Richtung ${esc(s.richtung)}` : "";
    return `<li>${esc(s.ab)} ab ${esc(s.von)}: <b>${esc(s.linie)}</b>${dir}<br>${esc(s.an)} an ${esc(s.nach)}</li>`;
  }).join("");
  return `<details class="trip"><summary>Fahrtdetails</summary><ul>${rows}</ul></details>`;
}

function commutePanel(l) {
  if (!l.commute || !l.commute.length) return "";
  const rows = l.commute.map((c) => {
    const changes = c.umstiege === 0 ? "ohne Umsteigen" : c.umstiege === 1 ? "1× umsteigen" : `${c.umstiege}× umsteigen`;
    const when = c.tage ? ` (${esc(c.tage)}, Ankunft ${esc(c.ankunft.replace(/^0/, ""))} Uhr)` : "";
    return `<li><b>${esc(c.name)}${when}:</b> ${c.minuten} Min., ${changes}${c.linien ? " (" + esc(c.linien) + ")" : ""}${tripSteps(c)}</li>`;
  }).join("");
  const approx = l.commute.some((c) => c.ungefaehr)
    ? '<div class="meta">Ungefähr: Die Anzeige nennt keine Straße, gerechnet wurde ab dem Stadtteil.</div>' : "";
  return `<div class="panel"><h3>Bus und Bahn zur Arbeit</h3><ul class="checks">${rows}</ul>${approx}</div>`;
}

function facts(l) {
  const f = [];
  const de = (n) => n.toLocaleString("de-DE");
  if (l.rooms) f.push(`${de(l.rooms)} Zi.`);
  if (l.living_area) f.push(`${de(l.living_area)} m²`);
  if (l.rent_warm) f.push(`${Math.round(l.rent_warm)} € warm`);
  else if (l.rent_cold) f.push(`${Math.round(l.rent_cold)} € kalt`);
  return f.join(" · ");
}

function ago(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 60) return `vor ${Math.max(min, 1)} Min.`;
  const h = Math.round(min / 60);
  if (h < 24) return `vor ${h} Std.`;
  return `vor ${Math.round(h / 24)} Tg.`;
}

function img(url, cls) {
  return url ? `<img class="${cls}" src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer">`
             : `<div class="${cls}"></div>`;
}

function renderTabs() {
  const counts = {};
  for (const l of state.listings) counts[l.status] = (counts[l.status] || 0) + 1;
  const active = state.listings.filter(isActive).length;
  const offline = state.listings.filter((l) => l.offline && !CLOSED.includes(l.status)).length;
  const tabs = [["aktiv", `Aktiv (${active})`]].concat(
    state.statuses.filter((s) => counts[s] && s !== "neu").map((s) => [s, `${LABELS[s]} (${counts[s]})`]),
    offline ? [["offline", `Nicht mehr online (${offline})`]] : []);
  $("#tabs").innerHTML = tabs.map(([k, label]) =>
    `<button data-f="${k}" class="${state.filter === k ? "on" : ""}">${esc(label)}</button>`).join("");
  $("#tabs").hidden = location.hash.startsWith("#/anzeige/") || location.hash === "#/vorlage";
}

function renderList() {
  const items = state.listings.filter((l) =>
    state.filter === "aktiv" ? isActive(l)
      : state.filter === "offline" ? l.offline && !CLOSED.includes(l.status)
      : l.status === state.filter);
  if (!items.length) {
    $("#app").innerHTML = `<p class="empty">${state.listings.length
      ? "Hier ist gerade nichts." : "Noch keine Treffer. Sobald etwas Passendes auftaucht, erscheint es hier."}</p>`;
    return;
  }
  $("#app").innerHTML = items.map((l) => {
    const c = l.checks;
    const chips = ["haustiere", "aussenbereich"].filter((k) => c[k]).map((k) =>
      `<span class="chip">${ICON[c[k].ergebnis]} ${esc(CHECK_LABELS[k])}</span>`).join("")
      + (l.offline ? '<span class="chip">⛔ Nicht mehr online</span>' : "")
      + (l.auffaellig && l.auffaellig.length ? '<span class="chip unklar">⚠️ Auffällig</span>' : "");
    const del = l.status === "uninteressant"
      ? `<button class="del" data-restore="${esc(l.key)}" title="Wiederherstellen">↩</button>`
      : `<button class="del" data-del="${esc(l.key)}" title="Löschen">🗑</button>`;
    return `<div class="item"><a class="card" href="#/anzeige/${encodeURIComponent(l.key)}">
      ${img(l.image_url, "thumb")}
      <div style="min-width:0">
        <h2>${esc(l.title)}</h2>
        <div class="meta">${esc(l.address || "")}</div>
        <div class="facts">${esc(facts(l))}</div>
        ${l.commute && l.commute.length ? `<div class="meta">${esc(commuteShort(l))}</div>` : ""}
        ${rentShort(l) || marketShort(l) ? `<div class="meta">${esc([rentShort(l), marketShort(l)].filter(Boolean).join(" · "))}</div>` : ""}
        <div class="chips"><span class="chip s-${l.status}">${LABELS[l.status]}</span>${chips}
          <span class="chip">${ago(l.first_seen)}</span></div>
      </div></a>${del}</div>`;
  }).join("");
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = () =>
    changeStatus(b.dataset.del, "uninteressant", "Gelöscht. Wiederherstellen unter „Gelöscht“."));
  document.querySelectorAll("[data-restore]").forEach((b) => b.onclick = () =>
    changeStatus(b.dataset.restore, "neu", "Wiederhergestellt"));
}

async function changeStatus(key, status, message) {
  try {
    await api(`/api/listings/${encodeURIComponent(key)}`, { method: "POST", body: JSON.stringify({ status }) });
    await load();
    renderTabs();
    renderList();
    toast(message);
  } catch (e) { if (e.message !== "login") toast(e.message); }
}

async function renderDetail(key) {
  const l = await api(`/api/listings/${encodeURIComponent(key)}`);
  const checks = Object.entries(l.checks).map(([k, c]) =>
    `<li class="${c.ergebnis === "ja" ? "ok" : c.ergebnis}">${ICON[c.ergebnis]}
      <b>${esc(CHECK_LABELS[k] || k)}:</b> ${esc(c.hinweis)}</li>`).join("");
  $("#app").innerHTML = `<div class="detail">
    <button class="back" onclick="location.hash='#/'">← Alle Treffer</button>
    ${gallery(l)}
    <h2>${esc(l.title)}</h2>
    <div class="meta">${esc(l.address || "")}${l.contact_name ? " · " + esc(l.contact_name) : ""}</div>
    <div class="facts">${esc(facts(l))}${l.available_from ? " · frei ab " + esc(l.available_from) : ""}</div>
    ${l.offline ? `<div class="panel">⛔ <b>Nicht mehr online:</b> Die Anzeige wurde beim Portal gelöscht
      (bemerkt ${esc(new Date(l.offline).toLocaleDateString("de-DE"))}).</div>` : ""}
    ${fakePanel(l)}

    <div class="panel steps">
      <button class="primary" id="copy">1. Anschreiben kopieren</button>
      <a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">2. Anzeige öffnen</a>
      <button id="asked">${l.status === "neu" ? "3. Als angefragt markieren" : "✓ " + LABELS[l.status]}</button>
      ${l.status === "uninteressant" ? "" : '<button id="delete">🗑 Löschen</button>'}
    </div>

    <div class="panel"><h3>Anschreiben</h3>
      <textarea id="letter" rows="12">${esc(l.letter)}</textarea></div>

    <div class="panel"><h3>Status</h3>
      <div class="statuses">${state.statuses.map((s) =>
        `<button data-s="${s}" class="${l.status === s ? "on" : ""}">${LABELS[s]}</button>`).join("")}</div>
      <h3 style="margin-top:14px">Notizen</h3>
      <textarea id="notes" rows="3" placeholder="z. B. Besichtigung Do 18 Uhr">${esc(l.notes)}</textarea>
    </div>

    ${mapPanel(l)}
    ${commutePanel(l)}
    ${rentPanel(l)}
    ${marketPanel(l)}
    <div class="panel"><h3>Prüfung</h3><ul class="checks">${checks}</ul></div>
    ${l.description ? `<div class="panel"><details><summary>Anzeigentext</summary>
      <p class="desc">${esc(l.description)}</p></details></div>` : ""}
  </div>`;

  drawMap(l);
  watchGallery();
  const setStatus = async (status, notes) => {
    await api(`/api/listings/${encodeURIComponent(key)}`,
      { method: "POST", body: JSON.stringify({ status, notes }) });
    await load();
    renderDetail(key);
  };
  $("#copy").onclick = async () => {
    try { await navigator.clipboard.writeText($("#letter").value); toast("Anschreiben kopiert"); }
    catch { $("#letter").select(); document.execCommand("copy"); toast("Anschreiben kopiert"); }
  };
  $("#asked").onclick = () => setStatus("angefragt");
  if ($("#delete")) $("#delete").onclick = async () => {
    await setStatus("uninteressant");
    location.hash = "#/";
    toast("Gelöscht. Wiederherstellen unter „Gelöscht“.");
  };
  document.querySelectorAll("[data-s]").forEach((b) => b.onclick = () => setStatus(b.dataset.s));
  $("#notes").onblur = async (e) => {
    await api(`/api/listings/${encodeURIComponent(key)}`,
      { method: "POST", body: JSON.stringify({ notes: e.target.value }) });
    toast("Notiz gespeichert");
  };
}

async function renderTemplate() {
  const t = await api("/api/vorlage");
  const help = Object.entries(t.placeholders).map(([k, v]) =>
    `<li><code>{${esc(k)}}</code> ${esc(v)}</li>`).join("");
  $("#app").innerHTML = `<div class="detail">
    <button class="back" onclick="location.hash='#/'">← Alle Treffer</button>
    <h2>Anschreiben-Vorlage</h2>
    <div class="meta">Gilt sofort für alle Treffer. Platzhalter werden pro Anzeige ausgefüllt.</div>
    <div class="panel"><textarea id="tpl" rows="18">${esc(t.text)}</textarea>
      <button class="primary" id="save" style="width:100%;margin-top:10px">Speichern</button></div>
    <div class="panel"><h3>Platzhalter</h3><ul class="checks">${help}</ul></div>
  </div>`;
  $("#save").onclick = async () => {
    try {
      await api("/api/vorlage", { method: "PUT", body: JSON.stringify({ text: $("#tpl").value }) });
      toast("Vorlage gespeichert");
    } catch (e) { toast(e.message); }
  };
}

async function load() {
  const data = await api("/api/listings");
  state.listings = data.listings;
  state.statuses = data.statuses;
}

async function route() {
  renderTabs();
  const m = location.hash.match(/^#\/anzeige\/(.+)$/);
  if (m) { await renderDetail(decodeURIComponent(m[1])); window.scrollTo(0, 0); }
  else if (location.hash === "#/vorlage") await renderTemplate();
  else renderList();
}

$("#tabs").onclick = (e) => {
  const f = e.target.dataset.f;
  if (!f) return;
  state.filter = f;
  renderTabs();
  renderList();
};

// --- Push-Nachrichten -------------------------------------------------------

function b64ToBytes(s) {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

async function setupPush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  const reg = await navigator.serviceWorker.register("/sw.js");
  const existing = await reg.pushManager.getSubscription();
  const btn = $("#push");
  btn.hidden = false;
  if (existing && Notification.permission === "granted") {
    // Bei jedem Start erneut melden, falls der Server die Anmeldung verloren hat.
    api("/api/push/subscribe", { method: "POST", body: JSON.stringify(existing) }).catch(() => {});
    showTestButton(btn);
    return;
  }
  btn.onclick = async () => {
    if (await Notification.requestPermission() !== "granted") {
      toast("Benachrichtigungen wurden nicht erlaubt");
      return;
    }
    const { publicKey } = await api("/api/push/key");
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true, applicationServerKey: b64ToBytes(publicKey) });
    await api("/api/push/subscribe", { method: "POST", body: JSON.stringify(sub) });
    toast("Push-Nachrichten sind aktiv");
    showTestButton(btn);
  };
}

function showTestButton(btn) {
  btn.textContent = "🔔 Push testen";
  btn.onclick = async () => {
    try {
      await api("/api/push/test", { method: "POST" });
      toast("Test geschickt. Kommt nichts an, Benachrichtigungen am Handy prüfen.");
    } catch (e) { if (e.message !== "login") toast(e.message); }
  };
}

window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", async () => {
  // Auf der Detailseite nicht neu zeichnen, sonst gehen Änderungen am Anschreiben verloren.
  if (document.visibilityState === "visible" && !location.hash.startsWith("#/anzeige/")
      && location.hash !== "#/vorlage") {
    await load();
    route();
  }
});

load().then(route).catch((e) => { if (e.message !== "login") $("#app").textContent = e.message; });
setupPush();
</script>
